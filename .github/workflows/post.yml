name: Post next Reel

on:
  schedule:
    # Backup only: cron-job.org is the main trigger (20:02 Tashkent).
    # These backup checks run at 20:20 and 20:45 Tashkent time.
    - cron: "20,45 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post the next video right now, ignoring the daily time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post the next video in the queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841476863950726" # @animated.intuition
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          export PUBLIC_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/post_next.py

      - name: Save posted.json and PLAN.md
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update posting log and plan" && git push; }
