name: Post next Reel

on:
  schedule:
    # 14:00 UTC = 19:00 in Tashkent. GitHub may start it up to ~30 min late.
    - cron: "0 14 * * *"
  workflow_dispatch: {} # "Run workflow" button, for testing

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post the next video in the queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841476863950726" # @animated.intuition
        run: |
          export PUBLIC_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/post_next.py

      - name: Remember what was posted
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Posted on $(date -u +%F)" && git push; }
