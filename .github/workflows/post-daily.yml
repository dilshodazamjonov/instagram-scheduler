name: Post next Reel

on:
  schedule:
    # Checks twice an hour; scripts/post_next.py posts once a day at the time
    # set in schedule.json. Change the time there, not here.
    - cron: "7,37 * * * *"
  workflow_dispatch: {} # "Run workflow" button: posts the next video right away

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post the next video in the queue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841476863950726" # @animated.intuition
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          export PUBLIC_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python scripts/post_next.py

      - name: Remember what was posted
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Posted on $(date -u +%F)" && git push; }
